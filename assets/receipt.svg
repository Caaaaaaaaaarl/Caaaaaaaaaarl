<title id="t">Official receipt from Caaaaaaaaaarl General Merchandise &amp; Code</title>
<desc id="d">A printed receipt listing Carl's projects as items: a Kotlin POS app, a library system capstone, PulseCare, the Hoby buddy app, the TSA community site, a C# inventory CLI, a minimal API, birthday and valentine sites, and a Roblox game in progress. Total sleep lost: 351 hours. Salamat po!</desc>
