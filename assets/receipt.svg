        <text x="230.0" y="52" text-anchor="middle" class="big">CAAAAAAAAAARL</text><text x="230.0" y="81" text-anchor="middle" class="b">GENERAL MERCHANDISE &amp; CODE</text><text x="230.0" y="102" text-anchor="middle" class="t">Bicol, Philippines</text><text x="230.0" y="123" text-anchor="middle" class="dim">Non-VAT Reg. · open most nights</text><text x="34" y="156.6" class="dim" xml:space="preserve">OR No. 0000-0225</text><text x="426" y="156.6" text-anchor="end" class="dim">10/19/26  11:47 PM</text><text x="34" y="177.6" class="dim" xml:space="preserve">CASHIER: carl</text><text x="426" y="177.6" text-anchor="end" class="dim">TERMINAL: laptop</text><line x1="34" y1="192.6" x2="426" y2="192.6" class="rule"/><text x="34" y="214.35" class="b" xml:space="preserve">QTY  ITEM</text><text x="426" y="214.35" text-anchor="end" class="b">HRS</text><line x1="34" y1="229.35" x2="426" y2="229.35" class="rule"/><text x="34" y="251.1" class="t" xml:space="preserve"> 1   POS app for student sellers</text><text x="426" y="251.1" text-anchor="end" class="t">40</text><text x="34" y="272.1" class="dim" xml:space="preserve">     kotlin, android</text><text x="34" y="293.1" class="t" xml:space="preserve"> 1   library system (capstone)</text><text x="426" y="293.1" text-anchor="end" class="t">120</text><text x="34" y="314.1" class="dim" xml:space="preserve">     php, firebase, gemini</text><text x="34" y="335.1" class="t" xml:space="preserve"> 1   PulseCare clinic booking</text><text x="426" y="335.1" text-anchor="end" class="t">65</text><text x="34" y="356.1" class="dim" xml:space="preserve">     asp.net mvc, w/ 2 friends</text><text x="34" y="377.1" class="t" xml:space="preserve"> 1   Hoby: study + gym buddy app</text><text x="426" y="377.1" text-anchor="end" class="t">90</text><text x="34" y="398.1" class="dim" xml:space="preserve">     expo, firebase</text><text x="34" y="419.1" class="t" xml:space="preserve"> 1   TSA org community site</text><text x="426" y="419.1" text-anchor="end" class="t">18</text><text x="34" y="440.1" class="dim" xml:space="preserve">     vanilla js</text><text x="34" y="461.1" class="t" xml:space="preserve"> 1   inventory system, CLI</text><text x="426" y="461.1" text-anchor="end" class="t">12</text><text x="34" y="482.1" class="dim" xml:space="preserve">     c#, midterm</text><text x="34" y="503.1" class="t" xml:space="preserve"> 1   minimal REST API</text><text x="426" y="503.1" text-anchor="end" class="t">6</text><text x="34" y="524.1" class="dim" xml:space="preserve">     asp.net core</text><text x="34" y="545.1" class="t" xml:space="preserve"> 1   bday + valentine sites</text><text x="426" y="545.1" text-anchor="end" class="t">FREE</text><text x="34" y="566.1" class="dim" xml:space="preserve">     for people i like</text><text x="34" y="587.1" class="t" xml:space="preserve"> 1   a roblox game</text><text x="426" y="587.1" text-anchor="end" class="t">PEND</text><text x="34" y="608.1" class="dim" xml:space="preserve">     don't ask yet</text><line x1="34" y1="623.1" x2="426" y2="623.1" class="rule"/><text x="34" y="644.85" class="t" xml:space="preserve">SUBTOTAL</text><text x="426" y="644.85" text-anchor="end" class="t">351</text><text x="34" y="665.85" class="t" xml:space="preserve">LESS: stackoverflow disc.</text><text x="426" y="665.85" text-anchor="end" class="t">-0</text><text x="34" y="686.85" class="big2" xml:space="preserve">TOTAL SLEEP LOST</text><text x="426" y="686.85" text-anchor="end" class="big2">351 hrs</text><text x="34" y="720.45" class="t" xml:space="preserve">PAID: kape (3-in-1) x 47</text><text x="34" y="741.45" class="t" xml:space="preserve">CHANGE</text><text x="426" y="741.45" text-anchor="end" class="t">0.00</text><line x1="34" y1="756.45" x2="426" y2="756.45" class="rule"/><text x="230.0" y="778.2" text-anchor="middle" class="dim">currently learning: asp.net core,</text><text x="230.0" y="799.2" text-anchor="middle" class="dim">clean APIs, and when to stop adding features</text><g class="i